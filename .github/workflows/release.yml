name: Release

# Pushing a v<version> tag builds the macOS arm64 and Windows x64 installers and publishes them, with the
# electron-updater metadata and SHA256SUMS.txt, as one GitHub Release. The tag must equal
# TAKO_DESKTOP_VERSION in apps/desktop/scripts/tako-desktop-identity.mjs. Maintainer guide:
# docs/tako/maintainers.zh.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的已有 tag，例如 v0.1.0 / Existing tag to build'
        type: string
        required: true
      dry_run:
        description: '只构建并保留 Actions artifact，不创建或修改 GitHub Release / Build only'
        type: boolean
        default: false
      force_older:
        description: '允许 latest.json 回退到本次重建的旧 tag；仅在有意回滚国内下载通道时勾选 / Allow latest.json to move back to this older tag'
        type: boolean
        default: false
      allow_unsigned_mac:
        description: '缺少 Apple 签名 secrets 时发布未签名 mac 包（文件名带 -unsigned，无自动更新）/ Allow an unsigned macOS build'
        type: boolean
        default: false
      ref:
        description: 'dry run 时改从某个 git ref 构建（例如 refs/heads/main），用于打 tag 前的预演 / Git ref to build instead of the tag; dry runs only'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # A dry run may build a branch that is not tagged yet; everything else builds the tag that is being released.
  RELEASE_SOURCE_REF: ${{ inputs.ref || format('refs/tags/{0}', inputs.tag || github.ref_name) }}

jobs:
  plan:
    name: Check tag and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Refuse an untagged build that would publish
        if: inputs.ref != '' && inputs.dry_run != true
        run: |
          echo "::error title=--ref needs dry_run::A published release must be built from its tag; clear the ref input or enable dry_run."
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}
          sparse-checkout: apps/desktop/scripts

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require the tag to equal TAKO_DESKTOP_VERSION
        id: plan
        run: node apps/desktop/scripts/tako-release.mjs plan --tag "$RELEASE_TAG"

  macos:
    name: macOS arm64
    needs: plan
    runs-on: macos-15
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      # Secrets cannot appear in `if:`; this step reads them only to test presence.
      - name: Select the signing mode
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ALLOW_UNSIGNED_MAC: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_mac }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "macOS: Developer ID signing and notarization"
          elif [ "$ALLOW_UNSIGNED_MAC" = "true" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned macOS build::Missing secrets: ${missing[*]}. Publishing DSH-Tako-$VERSION-mac-arm64-unsigned.dmg without automatic updates."
          else
            echo "::error title=macOS signing secrets missing::Missing repository secrets: ${missing[*]}. Add them (docs/tako/maintainers.zh.md), or rerun Release with workflow_dispatch and allow_unsigned_mac to publish an unsigned -unsigned.dmg."
            exit 1
          fi

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-pnpm-

      - uses: actions/cache@v6.1.0
        with:
          path: |
            apps/desktop/.desktop-build/downloads
            ~/Library/Caches/electron
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-downloads-${{ hashFiles('scripts/primary-runtime/lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-desktop-downloads-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The official packaging path imports the p12 into its own temporary keychain. This step only decodes
      # the certificate and reads its Developer ID identity from a throwaway keychain that never joins the
      # search list, so codesign later sees exactly one matching identity.
      - name: Decode the certificate and resolve the signing identity
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/dsh-tako-certificate.p12"
          keychain="$RUNNER_TEMP/dsh-tako-identity.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          identity=$(security find-identity -p codesigning "$keychain" | grep -oE '"Developer ID Application: [^"]+"' | head -1 | tr -d '"' || true)
          security delete-keychain "$keychain"
          if [ -z "$identity" ]; then
            echo "::error title=No Developer ID Application identity::APPLE_CERTIFICATE must be a p12 export of a Developer ID Application certificate with its private key."
            exit 1
          fi
          echo "Signing identity: $identity"
          TAKO_MACOS_SIGNING_IDENTITY="$identity" TAKO_MACOS_CERTIFICATE_PATH="$certificate" \
            node apps/desktop/scripts/tako-release.mjs macos-env

      - name: Check packaging configuration and toolchain
        env:
          MAC_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if [ "$MAC_MODE" = signed ]; then
            pnpm run package:desktop:mac:arm64 --check --with-im-candidate
          else
            pnpm run package:desktop:mac:arm64:unsigned --check --with-im-candidate
          fi

      # Every release installer carries the reviewed @xmanrui/dsh-im candidate; the check and
      # build both fail when its descriptor is not release-eligible.
      - name: Build, sign, and notarize
        if: steps.signing.outputs.mode == 'signed'
        run: pnpm run package:desktop:mac:arm64 --with-im-candidate

      - name: Build unsigned
        if: steps.signing.outputs.mode == 'unsigned'
        run: pnpm run package:desktop:mac:arm64:unsigned --with-im-candidate

      - name: Collect release files
        env:
          MAC_MODE: ${{ steps.signing.outputs.mode }}
        run: >-
          node apps/desktop/scripts/tako-release.mjs collect --target mac-arm64 --version "$VERSION"
          --mode "$MAC_MODE" --output "$RUNNER_TEMP/release-assets"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-mac-arm64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
          # Installers are already compressed; storing them avoids re-deflating 600 MB per run.
          compression-level: 0

      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs-mac-arm64
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dsh-tako-certificate.p12" apps/desktop/.env.macos

    outputs:
      mac-mode: ${{ steps.signing.outputs.mode }}

  windows:
    name: Windows x64
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Allow long paths in the checkout
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Locate pnpm store
        id: pnpm-store
        run: |
          "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-pnpm-

      - uses: actions/cache@v6.1.0
        with:
          path: |
            apps/desktop/.desktop-build/downloads
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-downloads-${{ hashFiles('scripts/primary-runtime/lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-desktop-downloads-

      - name: Install (frozen lockfile)
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE

      # Windows packaging always reads .env.windows; DSH Tako needs no setting in it.
      - name: Select the default packaging settings
        run: |
          Set-Content -LiteralPath apps/desktop/.env.windows -Value '# DSH Tako release - defaults only'

      - name: Check packaging configuration and toolchain
        run: |
          pnpm run package:desktop:win:x64:unsigned-release --check --with-im-candidate
          exit $LASTEXITCODE

      # Every release installer carries the reviewed @xmanrui/dsh-im candidate; the check and
      # build both fail when its descriptor is not release-eligible.
      - name: Build installer and verify packaged runtime
        run: |
          pnpm run package:desktop:win:x64:unsigned-release --with-im-candidate
          exit $LASTEXITCODE

      - name: Install, launch, and uninstall the built installer
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File apps/desktop/tests/windows-release-install-smoke.ps1 `
            -Installer "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/DSH-Tako-$env:VERSION-win-x64.exe" `
            -Version $env:VERSION -OutputDirectory "$env:RUNNER_TEMP/release-install-smoke"
          exit $LASTEXITCODE

      - name: Collect release files
        run: |
          node apps/desktop/scripts/tako-release.mjs collect --target win-x64 --version "$env:VERSION" --mode signed --output "$env:RUNNER_TEMP/release-assets"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-win-x64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
          # The installer is a compressed NSIS executable; storing it avoids re-deflating it per run.
          compression-level: 0

      - name: Retain installation evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: installation-evidence-win-x64
          path: ${{ runner.temp }}/release-install-smoke/
          if-no-files-found: ignore
          retention-days: 14

      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs-win-x64
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [plan, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MAC_MODE: ${{ needs.macos.outputs.mac-mode }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}
          sparse-checkout: |
            .github
            apps/desktop/scripts

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Write checksums and release notes
        run: |
          node apps/desktop/scripts/tako-release.mjs checksums --directory "$RUNNER_TEMP/release-assets"
          node apps/desktop/scripts/tako-release.mjs notes --template .github/tako-release-notes.md \
            --version "$VERSION" --mode "$MAC_MODE" --output "$RUNNER_TEMP/release-notes.md"
          ls -l "$RUNNER_TEMP/release-assets"

      # Every already-compressed artifact is compared with the previous release, so a size
      # regression shows up in the run summary instead of silently inflating user downloads.
      - name: Compare artifact sizes with the previous release
        run: |
          node apps/desktop/scripts/tako-release.mjs size --directory "$RUNNER_TEMP/release-assets" \
            --tag "$RELEASE_TAG" --threshold 5

      - name: Create or update the release
        if: env.DRY_RUN != 'true'
        run: |
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/release-assets/*)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; replacing its assets."
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag \
              --title "DSH Tako $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Summarize a dry run
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "### Dry run: nothing was published"
            echo
            echo '```'
            cat "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"
            echo '```'
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"

  # Mirrors the published assets to the mainland download host (dsh-dl.shiroha.tech)
  # so `?source=fast` links stay fast for China users. Dry runs and releases that
  # never published are skipped.
  china-mirror:
    name: Mirror to China download host
    needs: [publish]
    if: github.event_name != 'workflow_dispatch' || inputs.dry_run != true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}
          sparse-checkout: apps/desktop/scripts

      - name: Download published release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$RUNNER_TEMP/mirror"
          gh release download "$RELEASE_TAG" --dir "$RUNNER_TEMP/mirror" --clobber
          cd "$RUNNER_TEMP/mirror"
          sha256sum -c SHA256SUMS.txt
          ls -l

      # The mainland host pulls the assets itself through its mesh squid proxy —
      # that leg is much faster than uploading from the runner across the GFW.
      # Files land in data.tmp, are verified against the just-published
      # SHA256SUMS, then moved into place so the mirror never serves a partial file.
      - name: Pull assets on the China mirror
        env:
          SSH_KEY: ${{ secrets.DSH_CN_SSH_KEY }}
          HOST: ${{ secrets.DSH_CN_HOST }}
          HOST_KEY: ${{ secrets.DSH_CN_HOST_KEY }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dsh_cn_key
          chmod 600 ~/.ssh/dsh_cn_key
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          # The asset list travels on stdin: interpolating it into the remote command line
          # puts every file name on one `for` word list, which breaks on names with spaces.
          ssh -i ~/.ssh/dsh_cn_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 "$HOST" \
            "set -e
            export https_proxy=http://172.17.66.4:3128
            mkdir -p /srv/dsh-dl/data.tmp && rm -rf /srv/dsh-dl/data.tmp/*
            cd /srv/dsh-dl/data.tmp
            while IFS= read -r f; do
              [ -n \"\$f\" ] || continue
              for try in 1 2 3 4 5; do
                curl -sfL -C - --max-time 900 \
                  -o \"\$f\" \"https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/\$f\" \
                  && break
                [ \"\$try\" = 5 ] && exit 1
                sleep 10
              done
            done
            sha256sum -c SHA256SUMS.txt
            for f in *; do mv -f \"\$f\" /srv/dsh-dl/data/\"\$f\"; done
            cd /srv/dsh-dl && rmdir data.tmp" \
            < <(cd "$RUNNER_TEMP/mirror" && ls)

      # Reruns of older releases keep calling /usr/local/bin/dsh-oss-sync.py, so
      # the host copy is what protects the channel there; fail before uploading
      # when it is not this tag's script. A tag that carries a newer sync script
      # needs that script installed on the host before it is tagged.
      - name: Check the installed OSS sync script
        env:
          SSH_KEY: ${{ secrets.DSH_CN_SSH_KEY }}
          HOST: ${{ secrets.DSH_CN_HOST }}
          HOST_KEY: ${{ secrets.DSH_CN_HOST_KEY }}
        run: |
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dsh_cn_key
          chmod 600 ~/.ssh/dsh_cn_key
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          expected=$(sha256sum apps/desktop/scripts/dsh-oss-sync.py | cut -d' ' -f1)
          installed=$(ssh -i ~/.ssh/dsh_cn_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 "$HOST" \
            'sha256sum /usr/local/bin/dsh-oss-sync.py' | cut -d' ' -f1)
          if [ "$installed" != "$expected" ]; then
            echo "::error title=Stale OSS sync script::/usr/local/bin/dsh-oss-sync.py ($installed) is not this tag's apps/desktop/scripts/dsh-oss-sync.py ($expected). Install the script from the tag being released. For a rerun of an older tag, do not install that tag's script: skip the channel update or roll it back with the manual --force-older command."
            exit 1
          fi

      # Mirrors the just-synced assets to oss://dsh-tako-dl/releases/<tag>/ on the
      # mainland host (credentials stay on that host in /etc/dsh-dl-oss.env), then
      # rewrites the dual-source latest.json contract. Script source of truth:
      # apps/desktop/scripts/dsh-oss-sync.py, installed at /usr/local/bin/dsh-oss-sync.py.
      - name: Mirror assets to OSS and publish latest.json
        env:
          SSH_KEY: ${{ secrets.DSH_CN_SSH_KEY }}
          HOST: ${{ secrets.DSH_CN_HOST }}
          HOST_KEY: ${{ secrets.DSH_CN_HOST_KEY }}
          FORCE_OLDER: ${{ inputs.force_older == true && '--force-older' || '' }}
        run: |
          printf '%s\n' "$SSH_KEY" > ~/.ssh/dsh_cn_key
          chmod 600 ~/.ssh/dsh_cn_key
          printf '%s\n' "$HOST_KEY" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/dsh_cn_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 "$HOST" \
            '/usr/local/bin/dsh-oss-sync.py --tag '"$RELEASE_TAG"' '"$FORCE_OLDER"''

      # The China channel is only as good as its URLs; fail the job if the manifest
      # or any OSS direct link is missing or unreachable.
      - name: Verify the OSS channel and latest.json contract
        run: python3 apps/desktop/scripts/dsh-oss-verify.py --tag "$RELEASE_TAG"
