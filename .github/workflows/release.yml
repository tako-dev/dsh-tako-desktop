name: Release

# Pushing a v<version> tag builds the macOS arm64 and Windows x64 installers and publishes them, with the
# electron-updater metadata and SHA256SUMS.txt, as one GitHub Release. The tag must equal
# TAKO_DESKTOP_VERSION in apps/desktop/scripts/tako-desktop-identity.mjs. Maintainer guide:
# docs/tako/maintainers.zh.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要构建的已有 tag，例如 v0.1.0 / Existing tag to build'
        type: string
        required: true
      dry_run:
        description: '只构建并保留 Actions artifact，不创建或修改 GitHub Release / Build only'
        type: boolean
        default: false
      allow_unsigned_mac:
        description: '缺少 Apple 签名 secrets 时发布未签名 mac 包（文件名带 -unsigned，无自动更新）/ Allow an unsigned macOS build'
        type: boolean
        default: false
      ref:
        description: 'dry run 时改从某个 git ref 构建（例如 refs/heads/main），用于打 tag 前的预演 / Git ref to build instead of the tag; dry runs only'
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
  # A dry run may build a branch that is not tagged yet; everything else builds the tag that is being released.
  RELEASE_SOURCE_REF: ${{ inputs.ref || format('refs/tags/{0}', inputs.tag || github.ref_name) }}

jobs:
  plan:
    name: Check tag and version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - name: Refuse an untagged build that would publish
        if: inputs.ref != '' && inputs.dry_run != true
        run: |
          echo "::error title=--ref needs dry_run::A published release must be built from its tag; clear the ref input or enable dry_run."
          exit 1

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}
          sparse-checkout: apps/desktop/scripts

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require the tag to equal TAKO_DESKTOP_VERSION
        id: plan
        run: node apps/desktop/scripts/tako-release.mjs plan --tag "$RELEASE_TAG"

  macos:
    name: macOS arm64
    needs: plan
    runs-on: macos-15
    timeout-minutes: 150
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      # Secrets cannot appear in `if:`; this step reads them only to test presence.
      - name: Select the signing mode
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          ALLOW_UNSIGNED_MAC: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_unsigned_mac }}
        run: |
          missing=()
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID KEYCHAIN_PASSWORD; do
            if [ -z "${!name}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "macOS: Developer ID signing and notarization"
          elif [ "$ALLOW_UNSIGNED_MAC" = "true" ]; then
            echo "mode=unsigned" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unsigned macOS build::Missing secrets: ${missing[*]}. Publishing DSH-Tako-$VERSION-mac-arm64-unsigned.dmg without automatic updates."
          else
            echo "::error title=macOS signing secrets missing::Missing repository secrets: ${missing[*]}. Add them (docs/tako/maintainers.zh.md), or rerun Release with workflow_dispatch and allow_unsigned_mac to publish an unsigned -unsigned.dmg."
            exit 1
          fi

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-pnpm-

      - uses: actions/cache@v6.1.0
        with:
          path: |
            apps/desktop/.desktop-build/downloads
            ~/Library/Caches/electron
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-downloads-${{ hashFiles('scripts/primary-runtime/lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-desktop-downloads-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # The official packaging path imports the p12 into its own temporary keychain. This step only decodes
      # the certificate and reads its Developer ID identity from a throwaway keychain that never joins the
      # search list, so codesign later sees exactly one matching identity.
      - name: Decode the certificate and resolve the signing identity
        if: steps.signing.outputs.mode == 'signed'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          certificate="$RUNNER_TEMP/dsh-tako-certificate.p12"
          keychain="$RUNNER_TEMP/dsh-tako-identity.keychain-db"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$certificate"
          chmod 600 "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          identity=$(security find-identity -p codesigning "$keychain" | grep -oE '"Developer ID Application: [^"]+"' | head -1 | tr -d '"' || true)
          security delete-keychain "$keychain"
          if [ -z "$identity" ]; then
            echo "::error title=No Developer ID Application identity::APPLE_CERTIFICATE must be a p12 export of a Developer ID Application certificate with its private key."
            exit 1
          fi
          echo "Signing identity: $identity"
          TAKO_MACOS_SIGNING_IDENTITY="$identity" TAKO_MACOS_CERTIFICATE_PATH="$certificate" \
            node apps/desktop/scripts/tako-release.mjs macos-env

      - name: Check packaging configuration and toolchain
        env:
          MAC_MODE: ${{ steps.signing.outputs.mode }}
        run: |
          if [ "$MAC_MODE" = signed ]; then
            pnpm run package:desktop:mac:arm64 --check
          else
            pnpm run package:desktop:mac:arm64:unsigned --check
          fi

      - name: Build, sign, and notarize
        if: steps.signing.outputs.mode == 'signed'
        run: pnpm run package:desktop:mac:arm64

      - name: Build unsigned
        if: steps.signing.outputs.mode == 'unsigned'
        run: pnpm run package:desktop:mac:arm64:unsigned

      - name: Collect release files
        env:
          MAC_MODE: ${{ steps.signing.outputs.mode }}
        run: >-
          node apps/desktop/scripts/tako-release.mjs collect --target mac-arm64 --version "$VERSION"
          --mode "$MAC_MODE" --output "$RUNNER_TEMP/release-assets"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-mac-arm64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
          # Installers are already compressed; storing them avoids re-deflating 600 MB per run.
          compression-level: 0

      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs-mac-arm64
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/dsh-tako-certificate.p12" apps/desktop/.env.macos

    outputs:
      mac-mode: ${{ steps.signing.outputs.mode }}

  windows:
    name: Windows x64
    needs: plan
    runs-on: windows-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: pwsh
    env:
      VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: Allow long paths in the checkout
        run: git config --system core.longpaths true

      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}

      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Locate pnpm store
        id: pnpm-store
        run: |
          "path=$(pnpm store path --silent)" >> $env:GITHUB_OUTPUT

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-node-${{ env.NODE_VERSION }}-pnpm-

      - uses: actions/cache@v6.1.0
        with:
          path: |
            apps/desktop/.desktop-build/downloads
            ~/AppData/Local/electron/Cache
          key: ${{ runner.os }}-${{ runner.arch }}-desktop-downloads-${{ hashFiles('scripts/primary-runtime/lock.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-desktop-downloads-

      - name: Install (frozen lockfile)
        run: |
          pnpm install --frozen-lockfile
          exit $LASTEXITCODE

      # Windows packaging always reads .env.windows; DSH Tako needs no setting in it.
      - name: Select the default packaging settings
        run: |
          Set-Content -LiteralPath apps/desktop/.env.windows -Value '# DSH Tako release - defaults only'

      - name: Check packaging configuration and toolchain
        run: |
          pnpm run package:desktop:win:x64:unsigned-release --check
          exit $LASTEXITCODE

      - name: Build installer and verify packaged runtime
        run: |
          pnpm run package:desktop:win:x64:unsigned-release
          exit $LASTEXITCODE

      # The release artifact itself is installed and removed here: the UI-driven `pnpm test:installer`
      # builds its own throwaway installer, so nothing else in CI ever ran the published bytes.
      - name: Install, launch, and uninstall the built installer
        run: |
          pwsh -NoProfile -ExecutionPolicy Bypass -File apps/desktop/tests/windows-release-install-smoke.ps1 `
            -Installer "apps/desktop/.desktop-build/targets/win-x64/unsigned-artifacts/DSH-Tako-$env:VERSION-win-x64.exe" `
            -Version $env:VERSION
          exit $LASTEXITCODE

      - name: Collect release files
        run: |
          node apps/desktop/scripts/tako-release.mjs collect --target win-x64 --version "$env:VERSION" --mode signed --output "$env:RUNNER_TEMP/release-assets"
          exit $LASTEXITCODE

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-win-x64
          path: ${{ runner.temp }}/release-assets/*
          if-no-files-found: error
          retention-days: 14
          # The installer is a compressed NSIS executable; storing it avoids re-deflating it per run.
          compression-level: 0

      - name: Retain packaging diagnostics
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: packaging-logs-win-x64
          include-hidden-files: true
          path: apps/desktop/.desktop-build/packaging-runs/
          if-no-files-found: ignore
          retention-days: 14

  publish:
    name: Publish GitHub Release
    needs: [plan, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      MAC_MODE: ${{ needs.macos.outputs.mac-mode }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_SOURCE_REF }}
          sparse-checkout: |
            .github
            apps/desktop/scripts

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      - name: Write checksums and release notes
        run: |
          node apps/desktop/scripts/tako-release.mjs checksums --directory "$RUNNER_TEMP/release-assets"
          node apps/desktop/scripts/tako-release.mjs notes --template .github/tako-release-notes.md \
            --version "$VERSION" --mode "$MAC_MODE" --output "$RUNNER_TEMP/release-notes.md"
          ls -l "$RUNNER_TEMP/release-assets"

      # Every already-compressed artifact is compared with the previous release, so a size
      # regression shows up in the run summary instead of silently inflating user downloads.
      - name: Compare artifact sizes with the previous release
        run: |
          node apps/desktop/scripts/tako-release.mjs size --directory "$RUNNER_TEMP/release-assets" \
            --tag "$RELEASE_TAG" --threshold 5

      - name: Create or update the release
        if: env.DRY_RUN != 'true'
        run: |
          shopt -s nullglob
          assets=("$RUNNER_TEMP"/release-assets/*)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG exists; replacing its assets."
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag \
              --title "DSH Tako $VERSION" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi

      - name: Summarize a dry run
        if: env.DRY_RUN == 'true'
        run: |
          {
            echo "### Dry run: nothing was published"
            echo
            echo '```'
            cat "$RUNNER_TEMP/release-assets/SHA256SUMS.txt"
            echo '```'
            echo
            cat "$RUNNER_TEMP/release-notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
