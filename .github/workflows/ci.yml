name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # package.json engines accept ^22.19 || >=24; packaging and the official CI use Node 24.
  NODE_VERSION: '24'
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  check:
    name: typecheck, lint, Tako and Desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from package.json packageManager.
      - uses: pnpm/action-setup@v5.0.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-node-${{ env.NODE_VERSION }}-pnpm-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Build the host native addon used by tests
        run: pnpm run build:native-system

      # The full suite is the upstream repository's responsibility; this fork tests what it changes:
      # the Desktop shell and packaging scripts, the Tako packages, and the client and boot packages
      # that carry DSH Tako branding, account, and profile changes.
      # Packaging-config tests load electron-builder and can exceed vitest's 5 s default on 4-core runners.
      - name: Tako and Desktop tests
        run: >-
          pnpm exec vitest run --testTimeout=30000
          apps/desktop
          packages/tako
          packages/client/ui-brand-official
          packages/client/ui-settings-account
          packages/client/ui-conversation
          packages/client/ui-layout
          packages/boot/app-boot
          scripts/tako-build-graph.spec.ts
          scripts/tako-removed-upstream-paths.spec.ts
          scripts/client-build-environment.client.spec.ts
