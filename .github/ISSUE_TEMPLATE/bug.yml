name: Bug
description: 桌面端坏了。机器人会回复并尝试修复发版。
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        这个仓库的 issue 由机器人处理。它用维护者账号回复，评论带 `bot` 标记。

        收到后会回复「收到，会改。」能修的会直接改、合并、发版，并在这条 issue 里更新状态。不要贴 API key 或密码。

        Issues here are handled by a bot posting as the maintainer (`bot` mark). It replies that it received the report, then tries to fix, merge, and release. Do not paste API keys.
  - type: textarea
    id: what
    attributes:
      label: 发生了什么
      description: 你做了什么，屏幕上看到什么。
      placeholder: 选了完全权限，新开会话还是工作区内修改。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本
      description: 设置里的 DSH Tako 版本，例如 0.1.40。
      placeholder: 0.1.40
  - type: dropdown
    id: system
    attributes:
      label: 系统
      options:
        - macOS
        - Windows
        - 其他
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: 邮箱（可选）
      description: 发版后机器人会发到这个地址。不填就只在 issue 里更新。
      placeholder: you@example.com
