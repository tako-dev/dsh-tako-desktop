name: 需求
description: 想加一个功能。机器人会回复并尝试做。
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        这个仓库的 issue 由机器人处理。它用维护者账号回复，评论带 `bot` 标记。

        收到后会回复「收到，会改。」能做的会直接做、合并、发版，并在这条 issue 里更新状态。不要贴 API key 或密码。

        Issues here are handled by a bot posting as the maintainer (`bot` mark). It replies that it received the request, then tries to build, merge, and release. Do not paste API keys.
  - type: textarea
    id: what
    attributes:
      label: 想要什么
      description: 用完之后，用户能做到什么。
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: 邮箱（可选）
      description: 发版后机器人会发到这个地址。不填就只在 issue 里更新。
      placeholder: you@example.com
